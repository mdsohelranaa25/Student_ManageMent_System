{% extends "base.html" %}

{% block content %}
  <nav class="section-nav" aria-label="Student Navigation">
    <a href="/student-dashboard/" class="section-tab section-tab-icon" title="Return to Dashboard Overview">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg>
    </a>
    <a href="/student-dashboard/profile/" class="section-tab {% if active == 'profile' %}active{% endif %}">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Profile</span>
    </a>
    <a href="/student-dashboard/routine/" class="section-tab {% if active == 'routine' %}active{% endif %}">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Routine</span>
    </a>
    <a href="/student-dashboard/attendance/" class="section-tab {% if active == 'attendance' %}active{% endif %}">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
      <span>Attendance</span>
    </a>
    <a href="/student-dashboard/notice/" class="section-tab {% if active == 'notice' %}active{% endif %}">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H8l-4 4z"/></svg>
      <span>Notice Board</span>
    </a>
    <a href="/student-dashboard/results/" class="section-tab {% if active == 'results' %}active{% endif %}">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      <span>Results</span>
    </a>
    <a href="/student-dashboard/change-password/" class="section-tab {% if active == 'password' %}active{% endif %}">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      <span>Security</span>
    </a>
  </nav>

  <div class="section-content">
    {% block section_content %}{% endblock %}
  </div>
{% endblock %}
