{% extends "base.html" %}

  <div class="dash-wrap">
    <aside class="dash-sidebar">
      <div class="dash-sidebar-title">Student</div>
      <nav>
        <a href="/student-dashboard/" class="dash-link {% if active == 'profile' %}active{% endif %}">Profile</a>
        <a href="/student-dashboard/routine/" class="dash-link {% if active == 'routine' %}active{% endif %}">Routine</a>
        <a href="/student-dashboard/attendance/" class="dash-link {% if active == 'attendance' %}active{% endif %}">Attendance</a>
